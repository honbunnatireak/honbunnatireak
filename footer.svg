<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="100%">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="140" fill="url(#sky2)"/>

  <g fill="#ffffff">
    <circle cx="120" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="55" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="25" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="50" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="28" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- hills -->
  <path d="M0 140 L0 105 Q120 70 260 100 T520 95 T780 100 T1000 90 L1000 140 Z" fill="#0b1226"/>
  <path d="M0 140 L0 120 Q180 95 340 118 T680 115 T1000 112 L1000 140 Z" fill="#050914"/>

  <text x="500" y="85" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" fill="#93c5fd">Thanks for visiting</text>
</svg>
